apiVersion: v1
kind: Pod
metadata:
  name: print-envars-greeting-pod
spec:
  containers:
    - name: print-envars-greeting-container
      image: bash
      command: ['sh', '-c', 'echo "$GREETING $COMPANY $GROUP"']
      env:
        - name: GREETING
          value: "Welcome to"
        - name: COMPANY
          value: "DevOps"
        - name: GROUP
          value: "Industries"