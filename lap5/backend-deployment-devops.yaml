apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy-deployment-devops
  namespace: haproxy-controller-devops
  labels:
    run: ingress-default-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      run: ingress-default-backend
  template:
    metadata:
      labels:
        run: ingress-default-backend
    spec:
      containers:
        - name: backend-container
          image: gcr.io/google_containers/defaultbackend:1.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP